name: Browser tests

# Installs a project with this metapackage (from the checkout, or a released
# version when project-version is given) on SQLite and checks the front page
# and the admin login in Chromium.

on:
    workflow_dispatch:
        inputs:
            send-success-notification:
                description: 'Send a notification when the tests pass'
                required: false
                type: boolean
                default: false
            project-version:
                description: 'Fill only when the tests should run on a stable release'
                required: false
                type: string
                default: ''
    push:
        branches:
            - master
            - "[0-9]+.[0-9]+"
    pull_request: ~

permissions:
    contents: read

jobs:
    browser-tests:
        name: "PHP 8.3/SQLite"
        uses: se7enxweb/gh-workflows/.github/workflows/browser-tests.yml@main
        with:
            project-version: ${{ inputs.project-version }}
            send-success-notification: ${{ inputs.send-success-notification == true }}
        secrets: inherit
