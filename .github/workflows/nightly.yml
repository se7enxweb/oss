name: Nightly browser tests

# Starts the browser tests of this repository every night on the branches
# listed below (workflow_dispatch with the workflow token).

on:
    schedule:
        - cron: "45 21 * * *"
    workflow_dispatch: ~

permissions:
    actions: write
    contents: read

jobs:
    nightly:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                branch:
                    - master
        steps:
            - name: Trigger browser tests on ${{ matrix.branch }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ matrix.branch }}
              run: |
                  gh workflow run browser-tests.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH" -f send-success-notification=false
                  echo "Started browser-tests.yml on ${BRANCH}"
